name: bouncer-pages

# Publishes the BOUNCER site (branch bouncer-main, folder bouncer/ of this
# repo) to GitHub Pages. Lives on the default branch because the
# github-pages environment only admits deployments from it. Runs after
# every green ci run on bouncer-main, or by hand.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [bouncer-main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bouncer-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bouncer-main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
