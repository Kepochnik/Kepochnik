name: probe

# A read-only look at the chain from a runner with internet access: what
# Blockscout knows about one address, what the CLI says, and any extra
# GET urls or raw JSON-RPC bodies the caller passes. Handy when the machine
# driving the repo cannot reach the chain itself.
on:
  workflow_dispatch:
    inputs:
      address:
        description: "Address to look at"
        required: false
        default: ""
      chain:
        description: "Chain key"
        required: false
        default: "robinhood"
      urls:
        description: "Extra GET urls, one per line"
        required: false
        default: ""
      rpc:
        description: "Raw JSON-RPC request bodies, one per line"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - name: Blockscout
        if: inputs.address != ''
        env:
          ADDR: ${{ inputs.address }}
          UA: "Mozilla/5.0 (X11; Linux x86_64) bouncer-probe/0.3"
        run: |
          B=https://robinhoodchain.blockscout.com
          echo "=== address"; curl -sS -A "$UA" -H "accept: application/json" "$B/api/v2/addresses/$ADDR" | head -c 1500; echo
          echo "=== contract"; curl -sS -A "$UA" -H "accept: application/json" "$B/api/v2/smart-contracts/$ADDR" | head -c 1500; echo
          echo "=== token"; curl -sS -A "$UA" -H "accept: application/json" "$B/api/v2/tokens/$ADDR" | head -c 800; echo
          echo "=== counters"; curl -sS -A "$UA" -H "accept: application/json" "$B/api/v2/tokens/$ADDR/counters" | head -c 400; echo
          echo "=== holders"; curl -sS -A "$UA" -H "accept: application/json" "$B/api/v2/tokens/$ADDR/holders" | head -c 3000; echo
          echo "=== transfers"; curl -sS -A "$UA" -H "accept: application/json" "$B/api/v2/tokens/$ADDR/transfers" | head -c 1500; echo
      - name: Extra urls
        if: inputs.urls != ''
        env:
          URLS: ${{ inputs.urls }}
          UA: "Mozilla/5.0 (X11; Linux x86_64) bouncer-probe/0.3"
        run: |
          printf '%s\n' "$URLS" | while IFS= read -r u; do
            [ -z "$u" ] && continue
            echo "=== GET $u"; curl -sS -A "$UA" -H "accept: application/json" "$u" | head -c 4000; echo
          done
      - name: Raw JSON-RPC
        if: inputs.rpc != ''
        env:
          RPC: ${{ inputs.rpc }}
        run: |
          printf '%s\n' "$RPC" | while IFS= read -r body; do
            [ -z "$body" ] && continue
            echo "=== RPC $body"; curl -sS -H 'content-type: application/json' --data "$body" https://rpc.mainnet.chain.robinhood.com | head -c 4000; echo
            sleep 2
          done
      - name: bouncer door
        if: inputs.address != ''
        env:
          ADDR: ${{ inputs.address }}
          CHAIN: ${{ inputs.chain }}
        run: node bin/bouncer.mjs door "$ADDR" --chain "$CHAIN" --no-dev --no-crew --format json | head -c 12000 || true
      - name: bouncer doctor
        run: node bin/bouncer.mjs doctor --chain "${{ inputs.chain }}" || true
      - name: Which Solana endpoints serve the heavy reads
        if: inputs.chain == 'solana'
        run: |
          # getTokenLargestAccounts is what the holder list rests on, and the
          # live profile showed it refused by every endpoint in the table at a
          # cost of twenty-six seconds. This asks each candidate directly, so
          # the table can be chosen from evidence rather than from reputation.
          MINT=EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
          for URL in \
            https://api.mainnet-beta.solana.com \
            https://solana-rpc.publicnode.com \
            https://solana.drpc.org \
            https://rpc.ankr.com/solana \
            https://solana.public-rpc.com \
            https://endpoints.omniatech.io/v1/sol/mainnet/public \
            https://solana.api.onfinality.io/public \
            https://api.blockeden.xyz/solana/67nCBdZQSH9z3YqDDjdm ; do
            for METHOD in getTokenLargestAccounts getTokenAccountsByOwner getMultipleAccounts ; do
              case "$METHOD" in
                getTokenLargestAccounts) BODY="{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$METHOD\",\"params\":[\"$MINT\"]}" ;;
                getTokenAccountsByOwner) BODY="{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$METHOD\",\"params\":[\"$MINT\",{\"programId\":\"TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA\"},{\"encoding\":\"base64\"}]}" ;;
                *) BODY="{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$METHOD\",\"params\":[[\"$MINT\"],{\"encoding\":\"base64\"}]}" ;;
              esac
              START=$(date +%s%3N)
              CODE=$(curl -sS -m 20 -o /tmp/p.json -w '%{http_code}' -X POST "$URL" -H 'content-type: application/json' -d "$BODY" 2>/dev/null || echo 000)
              MS=$(( $(date +%s%3N) - START ))
              if [ "$CODE" = "200" ] && grep -q '"result"' /tmp/p.json; then
                echo "OK    $METHOD  ${MS}ms  $URL"
              else
                echo "NO    $METHOD  ${MS}ms  http $CODE  $URL  $(head -c 120 /tmp/p.json | tr -d '\n')"
              fi
            done
          done
