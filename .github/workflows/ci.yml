name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run readonly-check
      - run: npm test
      - run: npm run site
      # The page is measured in a real browser at phone, tablet and laptop
      # width. A stylesheet that reads perfectly well can still scroll
      # sideways on a phone, and nothing over the source can see it.
      - run: npx --yes playwright-core install chromium || true
      - run: npm run layout-check
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw
