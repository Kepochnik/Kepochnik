name: smoke

# Runs every command against a live chain and fails when one of them fails.
# The demo chain proves the code paths; only this proves the product. Nothing
# here signs or sends anything: the CLI has no transaction path at all.
on:
  workflow_dispatch:
    inputs:
      chain:
        description: "Chain key"
        required: false
        default: "robinhood"
      token:
        description: "A token to check (default: a recent launch found from the board)"
        required: false
        default: ""
  schedule:
    # Every morning: a public endpoint that changed its mind overnight should
    # not be discovered by a user pasting an address.
    - cron: "17 6 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - name: Every command, against the real chain
        env:
          CHAIN: ${{ inputs.chain || 'robinhood' }}
          TOKEN_IN: ${{ inputs.token }}
        run: |
          set -o pipefail
          B="node bin/bouncer.mjs"
          fail=0
          run() {
            name="$1"; shift
            echo "::group::$name"
            if timeout 240 "$@" > /tmp/out.txt 2>&1; then
              echo "PASS $name ($(wc -c < /tmp/out.txt) bytes)"
              head -c 1200 /tmp/out.txt
            else
              echo "::error::FAIL $name"
              cat /tmp/out.txt
              fail=1
            fi
            echo; echo "::endgroup::"
          }

          FAMILY=$(node -e 'const{CHAINS}=require("./dist/src/chain/chains.js");console.log((CHAINS[process.argv[1]]||{}).family||"evm")' "$CHAIN")
          if [ "$FAMILY" = "solana" ]; then
            run "doctor" $B doctor --chain "$CHAIN"
            MINT="${TOKEN_IN:-EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v}"          # USDC
            run "door (text)" $B door "$MINT" --chain "$CHAIN"
            run "door (json)" $B door "$MINT" --chain "$CHAIN" --format json
            # A Token-2022 mint, so the extension reader is exercised on real bytes.
            run "door (token-2022)" $B door "9BB6NFEcjBCtnNLFko2FqVQBq8HHM13kCyYcdQbgpump" --chain "$CHAIN"
            # A wallet, not a mint: the slip must name it rather than check it as a token.
            run "door (a wallet, not a mint)" $B door "11111111111111111111111111111111" --chain "$CHAIN"
            run "exit (the sale, priced)" $B exit "$MINT" --chain "$CHAIN"
            run "unsupported command is refused politely" bash -c "$B board --chain $CHAIN || true"

            # The market read has to produce numbers, not just avoid throwing.
            # The subject matters: pools are found by walking the mint's largest
            # accounts, which works for a token whose pools ARE its biggest
            # holders — a memecoin — and not for one like USDC, whose largest
            # accounts are exchanges. So the discovery is exercised on a pump
            # mint, and the slip is only required to carry a market section.
            echo "::group::solana market"
            for SUBJECT in "${TOKEN_IN:-9BB6NFEcjBCtnNLFko2FqVQBq8HHM13kCyYcdQbgpump}" "$MINT"; do
              echo "--- $SUBJECT"
              timeout 240 $B door "$SUBJECT" --chain "$CHAIN" --format json > /tmp/m.json 2>/dev/null || true
              REQUIRE_VENUE=$([ "$SUBJECT" = "$MINT" ] && echo no || echo yes) node -e '
                const j = JSON.parse(require("fs").readFileSync("/tmp/m.json","utf8"));
                const m = j.market;
                if (!m) {
                  console.error("::error::no market section on the slip at all");
                  for (const sk of j.skipped || []) console.error("  skipped:", sk.section, "-", sk.reason);
                  process.exit(1);
                }
                console.log("venue:", m.best ? m.best.name : "none", "| pools:", m.pools.length, "| curve:", m.curve ? (m.curve.complete ? "graduated" : "live") : "no");
                for (const p of m.pools) console.log("  ", p.name, p.concentrated ? "(ranged)" : "", String(p.quoteReserve), p.quoteSymbol);
                for (const q of m.quotes) console.log("   sell", q.shareBps/100 + "%:", String(q.out), m.quoteSymbol, "(" + (q.realisedBps/100).toFixed(1) + "% of spot)");
                console.log("note:", m.note);
                if (process.env.REQUIRE_VENUE === "yes" && !m.pools.length && !m.curve) {
                  console.error("::error::no venue found for a mint whose pools should be among its largest accounts — the vault walk is not working");
                  process.exit(1);
                }
              ' || fail=1
            done
            echo "::endgroup::"
            exit $fail
          fi

          # Does this chain have a launchpad at all? The board, the planner and the
          # curve exit only mean something where one does.
          HAS_PAD=$(node -e 'const{CHAINS}=require("./dist/src/chain/chains.js");const c=CHAINS[process.argv[1]];console.log(c&&c.launchpad&&c.factory?"yes":"no")' "$CHAIN")
          echo "launchpad on $CHAIN: $HAS_PAD"

          run "doctor" $B doctor --chain "$CHAIN"

          TOKEN="$TOKEN_IN"
          if [ "$HAS_PAD" = "yes" ]; then
            # The board is also how we find a real launch to run the rest against.
            run "board" $B board --chain "$CHAIN" --hours 2 --no-cover --format json
            run "plan"  $B plan --chain "$CHAIN"
            if [ -z "$TOKEN" ]; then
              TOKEN=$($B board --chain "$CHAIN" --hours 2 --no-cover --format json 2>/dev/null \
                | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const t=(j.launches||j.recent||[]).map(x=>x.token).filter(Boolean);console.log(t[0]||"")}catch{console.log("")}})' || true)
            fi
          fi
          if [ -z "$TOKEN" ]; then
            case "$CHAIN" in
              robinhood) TOKEN=0x39dbed3a2bd333467115de45665cc57f813c4571 ;;   # $PONS
              base)      TOKEN=0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913 ;;   # USDC on Base
              bnb)       TOKEN=0x0E09FaBB73Bd3Ade0a17ECC321fD13a19e81cE82 ;;   # CAKE
              *)         echo "::error::no default token for $CHAIN"; exit 1 ;;
            esac
            echo "::notice::no launch found, using the chain's reference token"
          fi
          echo "subject: $TOKEN"

          run "door (text)"     $B door "$TOKEN" --chain "$CHAIN"
          run "door (json)"     $B door "$TOKEN" --chain "$CHAIN" --format json
          run "door (markdown)" $B door "$TOKEN" --chain "$CHAIN" --format markdown
          run "door (svg card)" $B door "$TOKEN" --chain "$CHAIN" --format svg
          run "door (no explorer)" $B door "$TOKEN" --chain "$CHAIN" --no-blockscout
          run "exit"            $B exit "$TOKEN" --chain "$CHAIN"

          # A wallet that actually holds it, so the position path is exercised.
          HOLDER=$($B door "$TOKEN" --chain "$CHAIN" --format json 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const t=(j.open&&j.open.holders&&j.open.holders.top||[]).find(h=>!h.isContract&&h.role!=="burn");console.log(t?t.address:"")}catch{console.log("")}})' || true)
          if [ -z "$HOLDER" ]; then
            echo "::warning::no holder came back from the explorer; using the wrapped native token's own address so the path is still exercised"
            HOLDER=$(node -e 'const{CHAINS}=require("./dist/src/chain/chains.js");console.log((CHAINS[process.argv[1]].dex||{}).weth||"")' "$CHAIN")
          fi
          if [ -n "$HOLDER" ]; then run "wallet" $B wallet "$TOKEN" "$HOLDER" --chain "$CHAIN"; else echo "::warning::wallet not exercised"; fi

          DEPLOYER=$($B door "$TOKEN" --chain "$CHAIN" --format json 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log((j.open&&j.open.deployer&&j.open.deployer.address)||(j.id&&j.id.launch&&j.id.launch.deployer)||"")}catch{console.log("")}})' || true)
          # The dev report card counts a deployer's launches, which only exists where
          # a launchpad does. On a chain without one it must refuse clearly, not throw.
          if [ "$HAS_PAD" = "yes" ]; then
            if [ -n "$DEPLOYER" ]; then run "dev" $B dev "$DEPLOYER" --chain "$CHAIN" --hours 6; else echo "::warning::no deployer found, dev not exercised"; fi
          else
            echo "::group::dev refuses clearly on a chain with no launchpad"
            if $B dev 0x0000000000000000000000000000000000000001 --chain "$CHAIN" 2>&1 | tee /tmp/dev.txt; then
              echo "::error::dev should not succeed on a chain with no launchpad"; fail=1
            elif grep -q "answers for any token" /tmp/dev.txt; then
              echo "PASS dev refuses and points at the command that works"
            else
              echo "::error::dev refused without saying what to do instead"; cat /tmp/dev.txt; fail=1
            fi
            echo "::endgroup::"
          fi

          # The input a user is most likely to paste by mistake: an address with
          # no contract behind it.
          run "door (an empty address)" $B door 0x000000000000000000000000000000000000dEaD --chain "$CHAIN"

          # Who holds the liquidity has to come back with numbers on a chain
          # whose pools are real. A section that quietly reads zero everywhere
          # would pass every other check in this file.
          echo "::group::liquidity"
          $B door "$TOKEN" --chain "$CHAIN" --format json > /tmp/l.json 2>/dev/null || true
          node -e '
            const j = JSON.parse(require("fs").readFileSync("/tmp/l.json","utf8"));
            const l = j.open && j.open.liquidity;
            const pools = (j.open && j.open.pools) || [];
            if (!pools.length) { console.log("no pool on this chain for this token; liquidity not applicable"); process.exit(0); }
            if (!l) { console.error("::error::pools were found but the liquidity read produced nothing"); process.exit(1); }
            console.log(`${l.dex} ${l.kind}: ${l.burnedBps/100}% burned, ${l.lockedBps/100}% locked, ${l.freeBps/100}% withdrawable`);
            for (const h of l.holders) console.log("  ", h.kind, h.name || "", h.address, (h.shareBps/100)+"%");
            if (l.unread) console.log("unread:", l.unread);
            const total = l.burnedBps + l.lockedBps + l.freeBps;
            if (Math.abs(total - 10000) > 1 && l.holders.length) { console.error("::error::the shares do not add up: "+total); process.exit(1); }
            if (!l.holders.length && !l.unread) { console.error("::error::no holders and no reason given"); process.exit(1); }
          ' || fail=1
          echo "::endgroup::"

          # The tape. On a V2 launch this is the curve's own events; on anything
          # else — a Pons V1 launch like $PONS, an ordinary ERC-20 on Base or
          # BNB — it is the token's transfers with its pools named. Bounded to
          # one round so it is a check rather than a stream.
          run "watch (one round)" $B watch "$TOKEN" --chain "$CHAIN" --rounds 1 --quiet

          # The itemised receipt reads the launchpad's own curve events, so it
          # only exists where a launchpad does. A transaction from the tape that
          # is not a curve trade must be refused by name, not crash.
          if [ "$HAS_PAD" = "yes" ]; then
            HASH=$(timeout 240 $B watch "$TOKEN" --chain "$CHAIN" --rounds 1 --quiet 2>/dev/null \
              | grep -o '0x[0-9a-fA-F]\{64\}' | tail -1 || true)
            if [ -z "$HASH" ]; then
              echo "::warning::nothing moved in the watch window, receipt not exercised"
            else
              echo "::group::receipt $HASH"
              if timeout 240 $B receipt "$HASH" --chain "$CHAIN" > /tmp/r.txt 2>&1; then
                echo "PASS receipt"; head -c 1200 /tmp/r.txt
              elif grep -q "no curve buy or sell in it" /tmp/r.txt; then
                echo "PASS receipt refused a non-curve transaction by name"; cat /tmp/r.txt
              else
                echo "::error::FAIL receipt"; cat /tmp/r.txt; fail=1
              fi
              echo; echo "::endgroup::"
            fi
          fi

          exit $fail
      - name: The MCP server answers over stdio
        env:
          CHAIN: ${{ inputs.chain || 'robinhood' }}
        run: |
          set -o pipefail
          # Listing the tools proves the process starts. Calling one proves the
          # handler behind the name actually reads the chain, which is what an
          # agent asking BOUNCER a question depends on.
          SUBJECT=$(node -e 'const{CHAINS}=require("./dist/src/chain/chains.js");const c=CHAINS[process.argv[1]];console.log(c.family==="solana"?"EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v":({robinhood:"0x39dbed3a2bd333467115de45665cc57f813c4571",base:"0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913",bnb:"0x0E09FaBB73Bd3Ade0a17ECC321fD13a19e81cE82"})[process.argv[1]]||"")' "$CHAIN")
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            "{\"jsonrpc\":\"2.0\",\"id\":3,\"method\":\"tools/call\",\"params\":{\"name\":\"bouncer_check\",\"arguments\":{\"address\":\"$SUBJECT\",\"chain\":\"$CHAIN\"}}}" \
            | timeout 180 node bin/bouncer-mcp.mjs > /tmp/mcp.txt
          head -c 3000 /tmp/mcp.txt
          node -e '
            const lines = require("fs").readFileSync("/tmp/mcp.txt","utf8").trim().split("\n").map(l=>JSON.parse(l));
            const call = lines.find(l=>l.id===3);
            if (!call) { console.error("::error::no answer to tools/call"); process.exit(1); }
            if (call.error) { console.error("::error::bouncer_check failed: "+JSON.stringify(call.error)); process.exit(1); }
            if (call.result && call.result.isError) { console.error("::error::bouncer_check answered with an error result"); process.exit(1); }
            const text = JSON.stringify(call.result);
            if (text.length < 80) { console.error("::error::bouncer_check answered with nothing: "+text); process.exit(1); }
            console.log("PASS bouncer_check over stdio ("+text.length+" bytes)");
          '
