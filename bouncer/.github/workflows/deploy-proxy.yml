name: deploy-proxy

# Deploys proxy/worker.mjs to Cloudflare Workers. Needs two repository
# secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and
# CLOUDFLARE_ACCOUNT_ID. Runs on demand, and on every change to proxy/.
on:
  workflow_dispatch:
  push:
    branches: [main, bouncer-main]
    paths: ["proxy/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test proxy/*.test.mjs
      - name: Deploy with wrangler
        working-directory: proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets first"; exit 1; fi
          npx --yes wrangler@4 deploy
