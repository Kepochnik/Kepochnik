name: deploy-proxy

# Deploys proxy/worker.mjs to Cloudflare Workers.
# Normal path: the repository secret CLOUDFLARE_API_TOKEN (Cloudflare → My
# Profile → API Tokens → "Edit Cloudflare Workers" template). The account id
# is read from the token itself (wrangler whoami) unless given.
# One-off path: the token can be typed into the run form; it is masked in
# the logs and never stored. Roll it afterwards and add a proper secret.
on:
  workflow_dispatch:
    inputs:
      api_token:
        description: "Cloudflare API token for this one run (prefer the CLOUDFLARE_API_TOKEN repository secret)"
        required: false
      account_id:
        description: "Cloudflare Account ID (optional: read from the token when empty)"
        required: false
  push:
    branches: [main, bouncer-main]
    paths: ["proxy/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ inputs.api_token || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account_id || secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Mask the token
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "::add-mask::$CLOUDFLARE_API_TOKEN"; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test proxy/*.test.mjs
      - name: Deploy with wrangler
        working-directory: proxy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Add it as a Repository secret at https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions or type it into the run form."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            CLOUDFLARE_ACCOUNT_ID="$(npx --yes wrangler@4 whoami 2>/dev/null | grep -oE '[0-9a-f]{32}' | head -1 || true)"
            export CLOUDFLARE_ACCOUNT_ID
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::could not determine the Cloudflare account id; pass it in the run form or as CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          set -o pipefail
          if ! npx --yes wrangler@4 deploy 2>&1 | tee deploy.log; then
            if grep -q "code: 10000" deploy.log; then
              echo "::error::Cloudflare refused the token (Authentication error 10000): it lacks 'Workers Scripts: Edit' on this account. Create a new token from the 'Edit Cloudflare Workers' template (dash.cloudflare.com → My Profile → API Tokens → Create Token → Use template) and leave 'Account Resources' as 'All accounts'."
            fi
            exit 1
          fi
          URL="$(grep -oE 'https://[a-z0-9.-]*workers\.dev' deploy.log | head -1 || true)"
          echo "## bouncer-proxy" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "proxy_url=$URL" >> "$GITHUB_OUTPUT"
          echo "PROXY_URL=$URL"
      - name: Every chain route answers on the deployed worker
        working-directory: proxy
        run: |
          set -o pipefail
          URL="$(grep -oE 'https://[a-z0-9.-]*workers\.dev' deploy.log | head -1 || true)"
          if [ -z "$URL" ]; then echo "::error::no worker url in the deploy log"; exit 1; fi
          # A deploy that succeeds and a worker that serves the site are not the
          # same thing: the site reads through this proxy, so a chain whose route
          # is missing or refused is a chain the site cannot check at all.
          fail=0
          check() {
            key="$1"; body="$2"
            code=$(curl -sS -m 30 -o /tmp/r.json -w '%{http_code}' -X POST "$URL/rpc/$key" -H 'content-type: application/json' -d "$body" || echo 000)
            if [ "$code" = "200" ] && grep -q '"result"' /tmp/r.json; then
              echo "PASS $key: $(head -c 160 /tmp/r.json)"
            else
              echo "::error::$key route failed (http $code): $(head -c 300 /tmp/r.json)"; fail=1
            fi
          }
          EVM='{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'
          check robinhood "$EVM"
          check base      "$EVM"
          check bnb       "$EVM"
          check solana    '{"jsonrpc":"2.0","id":1,"method":"getSlot","params":[]}'
          # A write must still be refused by the deployed worker, not only by the test.
          code=$(curl -sS -m 30 -o /tmp/w.json -w '%{http_code}' -X POST "$URL/rpc/base" -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"eth_sendRawTransaction","params":["0x00"]}' || echo 000)
          if [ "$code" = "200" ]; then echo "::error::the deployed worker accepted a write method"; fail=1; else echo "PASS writes refused (http $code)"; fi
          exit $fail
