name: smoke

# Runs every command against a live chain and fails when one of them fails.
# The demo chain proves the code paths; only this proves the product. Nothing
# here signs or sends anything: the CLI has no transaction path at all.
on:
  workflow_dispatch:
    inputs:
      chain:
        description: "Chain key"
        required: false
        default: "robinhood"
      token:
        description: "A token to check (default: a recent launch found from the board)"
        required: false
        default: ""
  schedule:
    # Every morning: a public endpoint that changed its mind overnight should
    # not be discovered by a user pasting an address.
    - cron: "17 6 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - name: Every command, against the real chain
        env:
          CHAIN: ${{ inputs.chain || 'robinhood' }}
          TOKEN_IN: ${{ inputs.token }}
        run: |
          set -o pipefail
          B="node bin/bouncer.mjs"
          fail=0
          run() {
            name="$1"; shift
            echo "::group::$name"
            if timeout 240 "$@" > /tmp/out.txt 2>&1; then
              echo "PASS $name ($(wc -c < /tmp/out.txt) bytes)"
              head -c 1200 /tmp/out.txt
            else
              echo "::error::FAIL $name"
              cat /tmp/out.txt
              fail=1
            fi
            echo; echo "::endgroup::"
          }

          # Does this chain have a launchpad at all? The board, the planner and the
          # curve exit only mean something where one does.
          HAS_PAD=$(node -e 'const{CHAINS}=require("./dist/src/chain/chains.js");const c=CHAINS[process.argv[1]];console.log(c&&c.launchpad&&c.factory?"yes":"no")' "$CHAIN")
          echo "launchpad on $CHAIN: $HAS_PAD"

          run "doctor" $B doctor --chain "$CHAIN"

          TOKEN="$TOKEN_IN"
          if [ "$HAS_PAD" = "yes" ]; then
            # The board is also how we find a real launch to run the rest against.
            run "board" $B board --chain "$CHAIN" --hours 2 --no-cover --format json
            run "plan"  $B plan --chain "$CHAIN"
            if [ -z "$TOKEN" ]; then
              TOKEN=$($B board --chain "$CHAIN" --hours 2 --no-cover --format json 2>/dev/null \
                | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const t=(j.launches||j.recent||[]).map(x=>x.token).filter(Boolean);console.log(t[0]||"")}catch{console.log("")}})' || true)
            fi
          fi
          if [ -z "$TOKEN" ]; then
            case "$CHAIN" in
              robinhood) TOKEN=0x39dbed3a2bd333467115de45665cc57f813c4571 ;;   # $PONS
              base)      TOKEN=0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913 ;;   # USDC on Base
              bnb)       TOKEN=0x0E09FaBB73Bd3Ade0a17ECC321fD13a19e81cE82 ;;   # CAKE
              *)         echo "::error::no default token for $CHAIN"; exit 1 ;;
            esac
            echo "::notice::no launch found, using the chain's reference token"
          fi
          echo "subject: $TOKEN"

          run "door (text)"     $B door "$TOKEN" --chain "$CHAIN"
          run "door (json)"     $B door "$TOKEN" --chain "$CHAIN" --format json
          run "door (markdown)" $B door "$TOKEN" --chain "$CHAIN" --format markdown
          run "door (svg card)" $B door "$TOKEN" --chain "$CHAIN" --format svg
          run "door (no explorer)" $B door "$TOKEN" --chain "$CHAIN" --no-blockscout
          run "exit"            $B exit "$TOKEN" --chain "$CHAIN"

          # A wallet that actually holds it, so the position path is exercised.
          HOLDER=$($B door "$TOKEN" --chain "$CHAIN" --format json 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const t=(j.open&&j.open.holders&&j.open.holders.top||[]).find(h=>!h.isContract&&h.role!=="burn");console.log(t?t.address:"")}catch{console.log("")}})' || true)
          if [ -n "$HOLDER" ]; then run "wallet" $B wallet "$TOKEN" "$HOLDER" --chain "$CHAIN"; else echo "::warning::no plain holder found, wallet not exercised"; fi

          DEPLOYER=$($B door "$TOKEN" --chain "$CHAIN" --format json 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log((j.open&&j.open.deployer&&j.open.deployer.address)||(j.id&&j.id.launch&&j.id.launch.deployer)||"")}catch{console.log("")}})' || true)
          if [ -n "$DEPLOYER" ]; then run "dev" $B dev "$DEPLOYER" --chain "$CHAIN" --hours 6; else echo "::warning::no deployer found, dev not exercised"; fi

          # The input a user is most likely to paste by mistake: an address with
          # no contract behind it.
          run "door (an empty address)" $B door 0x000000000000000000000000000000000000dEaD --chain "$CHAIN"

          exit $fail
      - name: The MCP server answers over stdio
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | timeout 60 node bin/bouncer-mcp.mjs | head -c 2000
