<text x="24" y="156" fill="#ece6d2" xml:space="preserve">│ launched         4                                                       │</text>
<text x="24" y="176" fill="#ece6d2" xml:space="preserve">│ graduated        2                                                       │</text>
<text x="24" y="196" fill="#ece6d2" xml:space="preserve">│ graduation rate  50.0%  (launched in window that graduated in window)    │</text>
<text x="24" y="216" fill="#ece6d2" xml:space="preserve">│ dropout rate     50.0%  (still on the curve or dead)                     │</text>
<text x="24" y="236" fill="#c9962b" xml:space="preserve">├──────────────────────────────────────────────────────────────────────────┤</text>
<text x="24" y="256" fill="#ece6d2" xml:space="preserve">│ TIME TO GRADUATE (LAUNCH → POOL)                                         │</text>
<text x="24" y="276" fill="#ece6d2" xml:space="preserve">│ median      1h 2m                                                        │</text>
<text x="24" y="296" fill="#ece6d2" xml:space="preserve">│ fastest     3m 32s                                                       │</text>
