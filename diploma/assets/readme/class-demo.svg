<text x="24" y="56" fill="#c9962b" xml:space="preserve">┌──────────────────────────────────────────────────────────────────────────┐</text>
<text x="24" y="76" fill="#ece6d2" xml:space="preserve">│ YEARBOOK · class of 2026-09-15                                           │</text>
<text x="24" y="96" fill="#ece6d2" xml:space="preserve">│ 2026-09-14T15:40:00Z → 2026-09-15T00:00:00Z · blocks 31037500–31337500   │</text>
<text x="24" y="116" fill="#c9962b" xml:space="preserve">├──────────────────────────────────────────────────────────────────────────┤</text>
